# Build the GDScript tree and publish it to GitHub Pages (ROADMAP 9c).
#
# The C# project is never built here. Godot cannot export C# to the web at all, which is
# why web/ exists; this workflow installs the STANDARD engine, assembles the scratch
# project from web/ plus the shared assets and rewritten scenes, gates on the same
# harnesses that tools/web-port/check.py runs locally, and only then exports.
#
# The gate is a gate. A web demo that is stale or broken is worse than none, so a failing
# harness fails the build rather than warning — see ROADMAP 9d.

name: web

# Every push to main, now that the port is playable and the first manual run has proved
# the export. What makes this safe is the gate below rather than the trigger: check.py
# has to pass before anything is exported, so a push that breaks the port fails the build
# instead of publishing a broken demo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one in flight, or Pages can be left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache the engine and its export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-standard

      - name: Install Godot ${{ env.GODOT_VERSION }} (standard, not .NET)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates"

          curl -fsSL -o /tmp/godot.zip \
            "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

          # The templates are what a local machine usually lacks; CI fetches its own,
          # which is the reason the export is proved here rather than on a workstation.
          curl -fsSL -o /tmp/templates.tpz \
            "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

      - name: Check the port
        env:
          GODOT_STANDARD: /home/runner/godot/godot
        run: python tools/web-port/check.py

      - name: Export
        env:
          GODOT_STANDARD: /home/runner/godot/godot
        run: |
          set -euo pipefail
          mkdir -p build/web
          # --import first: the export needs the resources imported, and check.py has
          # already done it, but a cache miss on build/ would leave nothing to export.
          "$GODOT_STANDARD" --headless --path build/web-project --import
          "$GODOT_STANDARD" --headless --path build/web-project \
            --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm
          echo "--- exported ---"
          du -sh build/web
          ls -la build/web

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Drive the page that was just published and check it actually makes a noise.
  #
  # Everything in `build` runs the GDScript tree headless under the desktop engine, and
  # the desktop engine is exactly where the audio bug could not happen: Godot ships
  # `audio/general/default_playback_type.web` as Sample and everything else as Stream, so
  # the broken path only ever ran in a browser. Sixty passing checks and a silent game,
  # three deploys running. This is the check that would have caught it on the first one.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for the deployment to be live
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "${{ needs.deploy.outputs.page_url }}"; then
              echo "live after ${i} attempt(s)"; exit 0
            fi
            sleep 10
          done
          echo "page never came up"; exit 1
      - name: The page makes a noise
        run: node tools/web-port/browser_check.mjs "${{ needs.deploy.outputs.page_url }}"
