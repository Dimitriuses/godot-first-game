; The Web export preset (ROADMAP 9c).
;
; Assembled into the scratch project by tools/web-port/assemble.py; CI passes the output
; path on the command line, so export_path below is only a default.
;
; **thread_support MUST stay false.** A threaded web export needs SharedArrayBuffer,
; which browsers only hand out to pages served with the Cross-Origin-Opener-Policy and
; Cross-Origin-Embedder-Policy headers. GitHub Pages cannot set custom headers, so a
; threaded build would load and then fail at runtime with nothing useful in the console.
; Single-threaded has been the default since Godot 4.3, so this is the default too — it
; is written down because it is the one setting that silently breaks the deployment.
;
; It is also what lets tools/web-port/check.py --serve use a plain http.server: no
; special headers there either, so a build that runs locally runs on Pages.

[preset.0]

name="Web"
platform="Web"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/web/index.html"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include=""
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/offline_page=""
progressive_web_app/display=1
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)
